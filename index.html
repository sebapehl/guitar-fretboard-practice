<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Mastery</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --nav-bg: #343a40;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-top: 80px; /* Space for fixed header */
        }

        /* Burger Menu & Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .burger-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-right: 20px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: 0.3s;
        }
        header h2 { margin: 0; font-size: 1.2rem; }

        nav {
            position: fixed;
            top: 60px;
            left: -250px;
            width: 250px;
            height: calc(100vh - 60px);
            background: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transition: 0.3s;
            z-index: 999;
            padding-top: 20px;
        }
        nav.open { left: 0; }
        nav ul { list-style: none; padding: 0; margin: 0; }
        nav li {
            padding: 15px 25px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
        }
        nav li:hover { background: #f8f9fa; color: var(--primary); }
        nav li.active { background: #e7f3ff; color: var(--primary); }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-weight: 800; letter-spacing: -0.5px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-muted);
            opacity: 0;
            pointer-events: none;
        }
        .stats-bar.visible { opacity: 1; pointer-events: auto; }
        .timer { font-size: 1.5rem; color: var(--text); }
        
        .challenge-display {
            background: #f1f3f5;
            padding: 1.5rem;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 2rem;
            min-height: 3rem;
            text-align: center;
        }

        #fretboard-ui {
            margin: 20px 0;
            overflow-x: auto;
            width: 100%;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .note-buttons {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .note-btn {
            background: white;
            border: 2px solid #dee2e6;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }
        .note-btn:hover { border-color: var(--primary); color: var(--primary); }
        .note-btn:active { transform: scale(0.95); }

        .feedback {
            height: 2rem;
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-secondary { background: #6c757d; }

        /* Settings View */
        #settings-view {
            display: none;
            text-align: left;
        }
        .setting-group { margin-bottom: 1.5rem; }
        .setting-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        
        /* Leaderboard */
        .pb-display {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .note-buttons { grid-template-columns: repeat(4, 1fr); }
            .container { padding: 1rem; }
            body { padding-top: 70px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="burger-icon" id="burger-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <h2>Fretboard Mastery</h2>
    </header>

    <nav id="side-nav">
        <ul>
            <li data-mode="playground">Playground</li>
            <li data-mode="identify">Fret ➔ Note</li>
            <li data-mode="locate">Note ➔ Fret</li>
            <li id="menu-settings">Settings</li>
        </ul>
    </nav>

    <div class="container">
        <div id="game-view">
            <div class="stats-bar" id="stats-bar">
                <div id="round-indicator">Round 0/10</div>
                <div class="timer" id="timer-display">00.00s</div>
                <div id="score-indicator">Score: 0</div>
            </div>

            <div class="challenge-display" id="challenge-text">
                Ready?
            </div>

            <div id="fretboard-ui"></div>

            <div class="note-buttons" id="note-input" style="display: none;">
                <!-- Buttons injected by JS -->
            </div>

            <div class="feedback" id="feedback-text"></div>

            <div class="controls" id="main-controls">
                <button class="btn" id="start-btn">Start 10-Note Sprint</button>
            </div>

            <div class="pb-display" id="pb-text"></div>
        </div>

        <div id="settings-view">
            <h2>Settings</h2>
            <div class="setting-group">
                <label>Fret Range: <span id="fret-range-val">0 - 12</span></label>
                <input type="range" id="setting-fret-max" min="1" max="22" value="12">
            </div>
            <div class="controls">
                <button class="btn" id="save-settings-btn">Save & Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GameState, NOTES, STRINGS, getNoteAt } from './fretboard.js';
        import { FretboardUI } from './ui.js';

        const state = new GameState();
        let ui;
        let timerInterval;
        let activeNavMode = 'playground';

        // DOM Elements
        const gameView = document.getElementById('game-view');
        const settingsView = document.getElementById('settings-view');
        const challengeEl = document.getElementById('challenge-text');
        const noteInputEl = document.getElementById('note-input');
        const feedbackEl = document.getElementById('feedback-text');
        const timerEl = document.getElementById('timer-display');
        const roundEl = document.getElementById('round-indicator');
        const scoreEl = document.getElementById('score-indicator');
        const startBtn = document.getElementById('start-btn');
        const pbEl = document.getElementById('pb-text');
        const statsBar = document.getElementById('stats-bar');
        const burgerBtn = document.getElementById('burger-btn');
        const sideNav = document.getElementById('side-nav');
        const navItems = document.querySelectorAll('nav li[data-mode]');

        function init() {
            ui = new FretboardUI('fretboard-ui', state, handleFretClick);
            renderNoteButtons();
            loadPB();
            updatePBDisplay();
            setAppMode('playground');
        }

        // Navigation & Menu
        burgerBtn.addEventListener('click', () => {
            sideNav.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!sideNav.contains(e.target) && !burgerBtn.contains(e.target)) {
                sideNav.classList.remove('open');
            }
        });

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const mode = item.dataset.mode;
                setAppMode(mode);
                sideNav.classList.remove('open');
            });
        });

        document.getElementById('menu-settings').addEventListener('click', () => {
            stopGame();
            gameView.style.display = 'none';
            settingsView.style.display = 'block';
            sideNav.classList.remove('open');
        });

        function setAppMode(mode) {
            stopGame();
            activeNavMode = mode;
            state.mode = mode === 'playground' ? 'identify' : mode; // Map playground to identify for logic purposes
            
            navItems.forEach(i => i.classList.toggle('active', i.dataset.mode === mode));
            
            gameView.style.display = 'block';
            settingsView.style.display = 'none';

            if (mode === 'playground') {
                statsBar.classList.remove('visible');
                startBtn.style.display = 'none';
                noteInputEl.style.display = 'none';
                challengeEl.innerHTML = "Playground: Explore the neck!";
                pbEl.style.display = 'none';
            } else {
                statsBar.classList.remove('visible');
                startBtn.style.display = 'block';
                startBtn.innerText = `Start ${mode === 'identify' ? 'Fret ➔ Note' : 'Note ➔ Fret'} Sprint`;
                noteInputEl.style.display = 'none';
                challengeEl.innerHTML = mode === 'identify' ? "Identify the highlighted fret!" : "Locate the given note on the string!";
                pbEl.style.display = 'block';
                updatePBDisplay();
            }
            feedbackEl.innerText = '';
            ui.render();
        }

        function renderNoteButtons() {
            noteInputEl.innerHTML = NOTES.map(n => 
                `<button class="note-btn" data-note="${n}">${n}</button>`
            ).join('');

            noteInputEl.querySelectorAll('.note-btn').forEach(btn => {
                btn.addEventListener('click', () => submitAnswer(btn.dataset.note));
            });
        }

        function handleFretClick(stringIdx, fret) {
            if (state.status === 'playing') {
                if (state.mode !== 'locate') return;
                submitAnswer({ stringIdx, fret });
            } else {
                // Free Play mode
                const note = getNoteAt(STRINGS[stringIdx].open, fret);
                ui.showFeedback(stringIdx, fret, true, note);
            }
        }

        function submitAnswer(answer) {
            let feedbackStringIdx, feedbackFret;
            if (state.mode === 'identify') {
                feedbackStringIdx = state.currentChallenge.stringIdx;
                feedbackFret = state.currentChallenge.fret;
            } else {
                feedbackStringIdx = answer.stringIdx;
                feedbackFret = answer.fret;
            }

            const result = state.submitAnswer(answer);
            ui.showFeedback(feedbackStringIdx, feedbackFret, result.correct);

            if (result.correct) {
                feedbackEl.innerText = "Correct! ✅";
                feedbackEl.style.color = "green";
            } else {
                feedbackEl.innerText = `Missed! ${state.mode === 'identify' ? 'It was ' + state.currentChallenge.correctNote : ''} ❌`;
                feedbackEl.style.color = "red";
            }

            scoreEl.innerText = `Score: ${state.score}`;
            
            if (state.status === 'finished') {
                setTimeout(endGame, 500);
            } else {
                setTimeout(() => {
                    state.nextChallenge();
                    updateUI();
                }, 500);
            }
        }

        function updateUI() {
            roundEl.innerText = `Round ${state.currentRound}/${state.rounds}`;
            if (state.mode === 'identify') {
                challengeEl.innerHTML = `What note is this?`;
                noteInputEl.style.display = 'grid';
            } else {
                challengeEl.innerHTML = `Find&nbsp;<strong>${state.currentChallenge.correctNote}</strong>&nbsp;on string&nbsp;<strong>${state.currentChallenge.stringName}</strong>`;
                noteInputEl.style.display = 'none';
            }
            ui.render();
        }

        function startGame() {
            state.startRound();
            feedbackEl.innerText = '';
            startBtn.style.display = 'none';
            statsBar.classList.add('visible');
            updateUI();
            
            timerInterval = setInterval(() => {
                const time = state.getTotalTime();
                timerEl.innerText = `${time.toFixed(2)}s`;
            }, 50);
        }

        function stopGame() {
            clearInterval(timerInterval);
            state.status = 'idle';
            state.currentChallenge = null;
        }

        function endGame() {
            clearInterval(timerInterval);
            const totalTime = state.getTotalTime();
            timerEl.innerText = `${totalTime.toFixed(2)}s`;
            challengeEl.innerText = "Round Complete!";
            feedbackEl.innerText = `Final: ${state.score}/${state.rounds} in ${totalTime.toFixed(2)}s`;
            startBtn.style.display = 'block';
            startBtn.innerText = 'Go Again';
            noteInputEl.style.display = 'none';
            
            savePB(totalTime);
            updatePBDisplay();
            ui.render();
        }

        // Leaderboard
        function savePB(time) {
            if (state.score < state.rounds) return;
            const key = `pb_${state.mode}_${state.fretRange[1]}`;
            const currentPB = localStorage.getItem(key);
            if (!currentPB || time < parseFloat(currentPB)) {
                localStorage.setItem(key, time.toString());
            }
        }

        function loadPB() {
            const key = `pb_${state.mode}_${state.fretRange[1]}`;
            return localStorage.getItem(key);
        }

        function updatePBDisplay() {
            const pb = loadPB();
            const modeName = state.mode === 'identify' ? 'Fret ➔ Note' : 'Note ➔ Fret';
            if (pb) {
                pbEl.innerText = `Personal Best (${modeName}, 0-${state.fretRange[1]}): ${parseFloat(pb).toFixed(2)}s`;
            } else {
                pbEl.innerText = 'No PB yet for this mode/range. Aim for 10/10!';
            }
        }

        // Settings View
        document.getElementById('save-settings-btn').addEventListener('click', () => {
            state.fretRange = [0, parseInt(document.getElementById('setting-fret-max').value)];
            setAppMode(activeNavMode);
        });

        document.getElementById('setting-fret-max').addEventListener('input', (e) => {
            document.getElementById('fret-range-val').innerText = `0 - ${e.target.value}`;
        });

        startBtn.addEventListener('click', startGame);

        init();
    </script>
</body>
</html>
