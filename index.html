<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Mastery</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-weight: 800; letter-spacing: -0.5px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .timer { font-size: 1.5rem; color: var(--text); }
        
        .challenge-display {
            background: #f1f3f5;
            padding: 1.5rem;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 2rem;
            min-height: 3rem;
            text-align: center;
        }

        #fretboard-ui {
            margin: 20px 0;
            overflow-x: auto;
            width: 100%;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .note-buttons {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .note-btn {
            background: white;
            border: 2px solid #dee2e6;
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }
        .note-btn:hover { border-color: var(--primary); color: var(--primary); }
        .note-btn:active { transform: scale(0.95); }

        .feedback {
            height: 2rem;
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-secondary { background: #6c757d; }

        /* Settings View */
        #settings-view {
            display: none;
            text-align: left;
        }
        .setting-group { margin-bottom: 1.5rem; }
        .setting-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        
        /* Leaderboard */
        .pb-display {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="game-view">
            <div class="stats-bar">
                <div id="round-indicator">Round 0/10</div>
                <div class="timer" id="timer-display">00.00s</div>
                <div id="score-indicator">Score: 0</div>
            </div>

            <div class="challenge-display" id="challenge-text">
                Ready?
            </div>

            <div id="fretboard-ui"></div>

            <div class="note-buttons" id="note-input" style="display: none;">
                <!-- Buttons injected by JS -->
            </div>

            <div class="feedback" id="feedback-text"></div>

            <div class="controls">
                <button class="btn" id="start-btn">Start 10-Note Sprint</button>
                <button class="btn btn-secondary" id="to-settings-btn">Settings</button>
            </div>

            <div class="pb-display" id="pb-text"></div>
        </div>

        <div id="settings-view">
            <h2>Settings</h2>
            <div class="setting-group">
                <label>Mode</label>
                <select id="setting-mode">
                    <option value="identify">Identify Note (Physical ➔ Name)</option>
                    <option value="locate">Locate Fret (Name ➔ Physical)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Fret Range: <span id="fret-range-val">0 - 12</span></label>
                <input type="range" id="setting-fret-max" min="1" max="22" value="12">
            </div>
            <div class="controls">
                <button class="btn" id="save-settings-btn">Save & Back</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GameState, NOTES } from './fretboard.js';
        import { FretboardUI } from './ui.js';

        const state = new GameState();
        let ui;
        let timerInterval;

        // DOM Elements
        const gameView = document.getElementById('game-view');
        const settingsView = document.getElementById('settings-view');
        const challengeEl = document.getElementById('challenge-text');
        const noteInputEl = document.getElementById('note-input');
        const feedbackEl = document.getElementById('feedback-text');
        const timerEl = document.getElementById('timer-display');
        const roundEl = document.getElementById('round-indicator');
        const scoreEl = document.getElementById('score-indicator');
        const startBtn = document.getElementById('start-btn');
        const pbEl = document.getElementById('pb-text');

        function init() {
            ui = new FretboardUI('fretboard-ui', state, handleFretClick);
            renderNoteButtons();
            loadPB();
            updatePBDisplay();
        }

        function renderNoteButtons() {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            noteInputEl.innerHTML = notes.map(n => 
                `<button class="note-btn" data-note="${n}">${n}</button>`
            ).join('');

            noteInputEl.querySelectorAll('.note-btn').forEach(btn => {
                btn.addEventListener('click', () => submitAnswer(btn.dataset.note));
            });
        }

        function handleFretClick(stringIdx, fret) {
            if (state.status !== 'playing' || state.mode !== 'locate') return;
            submitAnswer({ stringIdx, fret });
        }

        function submitAnswer(answer) {
            // Determine which fret/string to highlight for feedback
            let feedbackStringIdx, feedbackFret;
            if (state.mode === 'identify') {
                feedbackStringIdx = state.currentChallenge.stringIdx;
                feedbackFret = state.currentChallenge.fret;
            } else {
                feedbackStringIdx = answer.stringIdx;
                feedbackFret = answer.fret;
            }

            const result = state.submitAnswer(answer);
            
            // Show visual feedback on fretboard
            ui.showFeedback(feedbackStringIdx, feedbackFret, result.correct);

            if (result.correct) {
                feedbackEl.innerText = "Correct! ✅";
                feedbackEl.style.color = "green";
            } else {
                feedbackEl.innerText = `Missed! ${state.mode === 'identify' ? 'It was ' + state.currentChallenge.correctNote : ''} ❌`;
                feedbackEl.style.color = "red";
            }

            scoreEl.innerText = `Score: ${state.score}`;
            
            // Small delay so user sees the green/red dot before UI resets
            if (state.status === 'finished') {
                setTimeout(endGame, 500);
            } else {
                setTimeout(() => {
                    state.nextChallenge();
                    updateUI();
                }, 500);
            }
        }

        function updateUI() {
            roundEl.innerText = `Round ${state.currentRound}/${state.rounds}`;
            if (state.mode === 'identify') {
                challengeEl.innerHTML = `What note is this?`;
                noteInputEl.style.display = 'grid';
            } else {
                challengeEl.innerHTML = `Find&nbsp;<strong>${state.currentChallenge.correctNote}</strong>&nbsp;on string&nbsp;<strong>${state.currentChallenge.stringName}</strong>`;
                noteInputEl.style.display = 'none';
            }
            ui.render();
        }

        function startGame() {
            state.startRound();
            feedbackEl.innerText = '';
            startBtn.style.display = 'none';
            updateUI();
            
            timerInterval = setInterval(() => {
                const time = state.getTotalTime();
                timerEl.innerText = `${time.toFixed(2)}s`;
            }, 50);
        }

        function endGame() {
            clearInterval(timerInterval);
            const totalTime = state.getTotalTime();
            timerEl.innerText = `${totalTime.toFixed(2)}s`;
            challengeEl.innerText = "Round Complete!";
            feedbackEl.innerText = `Final: ${state.score}/${state.rounds} in ${totalTime.toFixed(2)}s`;
            startBtn.style.display = 'block';
            startBtn.innerText = 'Go Again';
            noteInputEl.style.display = 'none';
            
            savePB(totalTime);
            updatePBDisplay();
            ui.render();
        }

        // Leaderboard logic
        function savePB(time) {
            if (state.score < state.rounds) return; // Only count perfect rounds for PB speed
            const key = `pb_${state.mode}_${state.fretRange[1]}`;
            const currentPB = localStorage.getItem(key);
            if (!currentPB || time < parseFloat(currentPB)) {
                localStorage.setItem(key, time.toString());
            }
        }

        function loadPB() {
            const key = `pb_${state.mode}_${state.fretRange[1]}`;
            return localStorage.getItem(key);
        }

        function updatePBDisplay() {
            const pb = loadPB();
            if (pb) {
                pbEl.innerText = `Personal Best (${state.mode}, 0-${state.fretRange[1]}): ${parseFloat(pb).toFixed(2)}s`;
            } else {
                pbEl.innerText = 'No PB yet for this mode/range. Aim for 10/10!';
            }
        }

        // Settings
        document.getElementById('to-settings-btn').addEventListener('click', () => {
            gameView.style.display = 'none';
            settingsView.style.display = 'block';
        });

        document.getElementById('save-settings-btn').addEventListener('click', () => {
            state.mode = document.getElementById('setting-mode').value;
            state.fretRange = [0, parseInt(document.getElementById('setting-fret-max').value)];
            settingsView.style.display = 'none';
            gameView.style.display = 'block';
            init();
        });

        document.getElementById('setting-fret-max').addEventListener('input', (e) => {
            document.getElementById('fret-range-val').innerText = `0 - ${e.target.value}`;
        });

        startBtn.addEventListener('click', startGame);

        init();
    </script>
</body>
</html>
